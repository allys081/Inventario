<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cajas y Espacios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #a855f7;
      --accent: #f1f5f9;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px 12px 60px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    
    .top-bar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      min-height: 40px;
    }
    .btn-back {
      position: absolute;
      left: 0;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0;
      text-align: center;
      color: var(--text);
    }

    .search-box {
      position: sticky;
      top: 10px;
      z-index: 20;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .search-input { border: none; outline: none; width: 100%; font-size: 0.95rem; font-family: inherit; }
    .btn-clear { border: none; background: none; cursor: pointer; color: var(--text-muted); font-size: 1rem; display: none; }
    
    .actions-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: var(--card); border: 1px solid var(--border); color: var(--text); }
    
    .card-list { display: flex; flex-direction: column; gap: 14px; }
    .group-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--border);
    }
    .group-title-box { display: flex; align-items: center; gap: 8px; }
    .group-title { font-weight: 700; font-size: 1.05rem; margin: 0; }
    .group-count {
      font-size: 0.72rem;
      font-weight: 600;
      background: var(--accent);
      padding: 2px 8px;
      border-radius: 12px;
      color: var(--text-muted);
    }
    .chevron { font-size: 0.75rem; color: var(--text-muted); transition: transform 0.2s; }
    .chevron.rotated { transform: rotate(-180deg); }
    .items-container { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
    
    .item-row {
      background: var(--accent);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .item-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
    
    .badge-categoria {
      background: #f1f5f9;
      color: #64748b;
      border: 1px solid #e2e8f0;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
    }

    /* Etiqueta verde suave para el detalle opcional */
    .badge-detalle-verde {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-block;
      width: fit-content;
    }

    .item-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .btn-icon {
      background: none; border: none; cursor: pointer; padding: 4px 6px; font-size: 0.85rem;
      color: var(--text-muted); border-radius: 4px;
    }
    .search-results-box { margin-bottom: 20px; display: none; }
    .search-title { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px);
      display: none; place-items: center; z-index: 50; padding: 16px;
    }
    .modal-overlay.active { display: grid; }
    .modal {
      background: #fff; border-radius: 14px; width: 100%; max-width: 380px; padding: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    .modal h3 { margin: 0 0 12px; font-size: 1.05rem; }
    .form-group { margin-bottom: 10px; }
    .form-label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
    .form-input {
      width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
      font-size: 0.88rem; font-family: inherit; outline: none;
    }
    .form-input:focus { border-color: var(--primary); }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <a href="index.html" class="btn-back">←</a>
      <h1>Cajas & Contenido</h1>
    </div>

    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="busqueda" class="search-input" placeholder="Buscar objeto">
      <button id="btn-limpiar" class="btn-clear">✕</button>
    </div>

    <div class="actions-row">
      <button class="btn btn-primary" onclick="abrirModalCaja()">+ Nueva Caja</button>
      <div style="display: flex; gap: 6px;">
        <button class="btn btn-secondary" id="btn-exportar">💾 Respaldar</button>
        <button class="btn btn-secondary" id="btn-importar">📂 Cargar</button>
        <input type="file" id="file-input" style="display: none;" accept=".json">
      </div>
    </div>

    <div id="search-box-results" class="search-results-box">
      <div class="search-title">Resultados</div>
      <div id="search-items"></div>
    </div>

    <div id="contenedor-cajas" class="card-list"></div>
  </div>

  <!-- Modal Caja -->
  <div class="modal-overlay" id="modal-caja">
    <div class="modal">
      <h3 id="modal-caja-titulo">Nueva Caja</h3>
      <div class="form-group">
        <label class="form-label">Nombre del contenedor o lugar</label>
        <input type="text" id="caja-nombre" class="form-input" placeholder="Ej: Caja Negra, Cajón del medio">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="cerrarModales()">Cancelar</button>
        <button class="btn btn-primary" id="btn-guardar-caja">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal Objeto con Detalle Opcional -->
  <div class="modal-overlay" id="modal-item">
    <div class="modal">
      <h3 id="modal-item-titulo">Agregar Objeto</h3>
      <div class="form-group">
        <label class="form-label">Nombre del Objeto</label>
        <input type="text" id="item-nombre" class="form-input" placeholder="Ej: Elásticos, Cinta adhesiva">
      </div>
      <div class="form-group">
        <label class="form-label">Detalle opcional (Cantidad, estado, etc.)</label>
        <input type="text" id="item-detalles" class="form-input" placeholder="Ej: 2 bolsas nuevas, sellado, color azul">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="cerrarModales()">Cancelar</button>
        <button class="btn btn-primary" id="btn-guardar-item">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    let db = JSON.parse(localStorage.getItem('org_cajas') || '[]');
    let colapso = JSON.parse(localStorage.getItem('colapso_cajas') || '{}');
    let activoId = null;
    let itemActivoId = null;

    function guardar() {
      localStorage.setItem('org_cajas', JSON.stringify(db));
      renderizar();
    }

    function fechaActual() {
      return new Date().toLocaleDateString('es-CL', {
        day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });
    }

    function renderizar() {
      const cont = document.getElementById('contenedor-cajas');
      cont.innerHTML = '';
      if (db.length === 0) {
        cont.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:40px 0;">No tienes cajas creadas.<br>Toca <b>+ Nueva Caja</b> para comenzar.</div>`;
        return;
      }
      db.forEach(c => {
        const div = document.createElement('div');
        div.className = 'group-card';
        const cant = c.items ? c.items.length : 0;
        const col = !!colapso[c.id];

        let itemsHTML = '';
        if (cant > 0) {
          c.items.forEach(it => {
            itemsHTML += `
              <div class="item-row">
                <div style="flex:1;">
                  <div class="item-name">${it.nombre}</div>
                  <div class="item-meta">
                    ${it.detalles ? `<div><span class="badge-detalle-verde">${it.detalles}</span></div>` : ''}
                    <div>Editado: ${it.fecha}</div>
                  </div>
                </div>
                <div>
                  <button class="btn-icon" onclick="editarItem('${c.id}', '${it.id}')">✎</button>
                  <button class="btn-icon" onclick="eliminarItem('${c.id}', '${it.id}')">🗑</button>
                </div>
              </div>`;
          });
        } else {
          itemsHTML = `<div style="font-size:0.78rem;color:var(--text-muted);font-style:italic;padding:4px 0;">Vacío.</div>`;
        }

        div.innerHTML = `
          <div class="group-header" onclick="toggleColapso('${c.id}')">
            <div class="group-title-box">
              <span class="group-title">${c.nombre}</span>
              <span class="group-count">${cant}</span>
            </div>
            <div onclick="event.stopPropagation()">
              <button class="btn-icon" onclick="editarCaja('${c.id}')">✎</button>
              <button class="btn-icon" onclick="eliminarCaja('${c.id}')">🗑</button>
              <span class="chevron ${col ? 'rotated' : ''}" onclick="toggleColapso('${c.id}')">▼</span>
            </div>
          </div>
          <div style="${col ? 'display:none;' : ''}">
            <div class="items-container">${itemsHTML}</div>
            <button class="btn btn-secondary" style="width:100%;justify-content:center;" onclick="nuevoItem('${c.id}')">+ Agregar objeto a ${c.nombre}</button>
          </div>`;
        cont.appendChild(div);
      });
    }

    function toggleColapso(id) {
      colapso[id] = !colapso[id];
      localStorage.setItem('colapso_cajas', JSON.stringify(colapso));
      renderizar();
    }

    function abrirModalCaja() {
      activoId = null;
      document.getElementById('modal-caja-titulo').textContent = 'Nueva Caja';
      document.getElementById('caja-nombre').value = '';
      document.getElementById('modal-caja').classList.add('active');
    }
    function editarCaja(id) {
      activoId = id;
      const c = db.find(x => x.id === id);
      document.getElementById('modal-caja-titulo').textContent = 'Editar Nombre';
      document.getElementById('caja-nombre').value = c.nombre;
      document.getElementById('modal-caja').classList.add('active');
    }
    document.getElementById('btn-guardar-caja').onclick = () => {
      const val = document.getElementById('caja-nombre').value.trim();
      if (!val) return;
      if (activoId) db.find(x => x.id === activoId).nombre = val;
      else db.push({ id: 'c_' + Date.now(), nombre: val, items: [] });
      cerrarModales(); guardar();
    };
    function eliminarCaja(id) {
      if (confirm('¿Eliminar esta caja y su contenido?')) {
        db = db.filter(x => x.id !== id);
        guardar();
      }
    }

    function nuevoItem(cajaId) {
      activoId = cajaId; itemActivoId = null;
      document.getElementById('modal-item-titulo').textContent = 'Agregar Objeto';
      document.getElementById('item-nombre').value = '';
      document.getElementById('item-detalles').value = '';
      document.getElementById('modal-item').classList.add('active');
    }
    function editarItem(cajaId, itemId) {
      activoId = cajaId; itemActivoId = itemId;
      const it = db.find(x => x.id === cajaId).items.find(x => x.id === itemId);
      document.getElementById('modal-item-titulo').textContent = 'Editar Objeto';
      document.getElementById('item-nombre').value = it.nombre;
      document.getElementById('item-detalles').value = it.detalles || '';
      document.getElementById('modal-item').classList.add('active');
    }
    document.getElementById('btn-guardar-item').onclick = () => {
      const nom = document.getElementById('item-nombre').value.trim();
      const det = document.getElementById('item-detalles').value.trim();
      if (!nom) return;
      const c = db.find(x => x.id === activoId);
      if (itemActivoId) {
        const it = c.items.find(x => x.id === itemActivoId);
        it.nombre = nom; it.detalles = det; it.fecha = fechaActual();
      } else {
        if (!c.items) c.items = [];
        c.items.push({ id: 'it_' + Date.now(), nombre: nom, detalles: det, fecha: fechaActual() });
      }
      cerrarModales(); guardar();
      if (document.getElementById('busqueda').value.trim()) {
        document.getElementById('busqueda').dispatchEvent(new Event('input'));
      }
    };
    function eliminarItem(cajaId, itemId) {
      if (confirm('¿Eliminar objeto?')) {
        const c = db.find(x => x.id === cajaId);
        c.items = c.items.filter(x => x.id !== itemId);
        guardar();
      }
    }

    // Buscador interactivo
    const inBusq = document.getElementById('busqueda');
    const boxRes = document.getElementById('search-box-results');
    const resIt = document.getElementById('search-items');
    const btnClr = document.getElementById('btn-limpiar');

    inBusq.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      btnClr.style.display = q ? 'block' : 'none';
      if (!q) { boxRes.style.display = 'none'; return; }
      resIt.innerHTML = '';
      let match = 0;
      db.forEach(c => {
        (c.items || []).forEach(it => {
          if (it.nombre.toLowerCase().includes(q) || (it.detalles && it.detalles.toLowerCase().includes(q))) {
            match++;
            resIt.innerHTML += `
              <div class="item-row" style="background:var(--accent); border-color:var(--border); margin-bottom:6px;">
                <div style="flex:1;">
                  <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
                    <span class="item-name" style="margin-bottom:0;">${it.nombre}</span>
                    <span class="badge-categoria">${c.nombre}</span>
                  </div>
                  <div class="item-meta">
                    ${it.detalles ? `<div><span class="badge-detalle-verde">${it.detalles}</span></div>` : ''}
                    <div>Editado: ${it.fecha}</div>
                  </div>
                </div>
              </div>`;
          }
        });
      });
      if (match === 0) resIt.innerHTML = `<div style="font-size:0.85rem;color:var(--text-muted);padding:6px 0;">Sin coincidencias.</div>`;
      boxRes.style.display = 'block';
    });
    btnClr.onclick = () => { inBusq.value = ''; btnClr.style.display = 'none'; boxRes.style.display = 'none'; };

    function cerrarModales() {
      document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
      activoId = null; itemActivoId = null;
    }

    // Respaldos
    document.getElementById('btn-exportar').onclick = () => {
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `respaldo-cajas-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    };
    document.getElementById('btn-importar').onclick = () => document.getElementById('file-input').click();
    document.getElementById('file-input').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = (ev) => {
        try {
          db = JSON.parse(ev.target.result);
          guardar();
          alert('¡Cajas cargadas con éxito!');
        } catch (err) { alert('Archivo no válido.'); }
      };
      r.readAsText(file);
    };

    renderizar();
  </script>
</body>
</html>

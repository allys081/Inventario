    [data-theme=dark][data-acc=violeta]{--p:#a78bfa;--p-soft:#2b2445;--p-line:#4c3f7a;--p-glow:rgba(167,139,250,.25);--pk:#a78bfa;--pk-soft:#2b2445;--on-p:#14121a;--on-pk:#14121a}
    [data-acc=rosa]{--p:#c2417a;--p-soft:#fbe1ec;--p-line:#f0b6cf;--p-glow:rgba(194,65,122,.2);--pk:#c2417a;--pk-soft:#fbe1ec;--on-p:#fff;--on-pk:#fff}
    [data-theme=dark][data-acc=rosa]{--p:#f472b6;--p-soft:#40202f;--p-line:#5b2a45;--p-glow:rgba(244,114,182,.25);--pk:#f472b6;--pk-soft:#40202f;--on-p:#14121a;--on-pk:#14121a}
    [data-acc=celeste]{--p:#3b82c4;--p-soft:#dcebf8;--p-line:#b3d3ee;--p-glow:rgba(59,130,196,.22);--pk:#3b82c4;--pk-soft:#dcebf8;--on-p:#fff;--on-pk:#fff}
    [data-theme=dark][data-acc=celeste]{--p:#7cb7ff;--p-soft:#1b2c44;--p-line:#2f4b73;--p-glow:rgba(124,183,255,.25);--pk:#7cb7ff;--pk-soft:#1b2c44;--on-p:#14121a;--on-pk:#14121a}
    [data-acc=agua]{--p:#2f8a76;--p-soft:#d9f0ea;--p-line:#a8d9cd;--p-glow:rgba(47,138,118,.22);--pk:#2f8a76;--pk-soft:#d9f0ea;--on-p:#fff;--on-pk:#fff}
    [data-theme=dark][data-acc=agua]{--p:#5eead4;--p-soft:#173b36;--p-line:#2c6a60;--p-glow:rgba(94,234,212,.22);--pk:#5eead4;--pk-soft:#173b36;--on-p:#14121a;--on-pk:#14121a}

    .group-card::before{display:none}
    .group-card{padding-left:16px}
    .card-list.grid .group-card{padding-left:12px}

    /* Títulos de contenedores: máx. 2 líneas; si no caben, se achican y al final se cortan con … */
    .group-title,.c-name,#det-titulo{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;line-height:1.2;min-width:0}
    .group-title-box{min-width:0;flex:1}
    .group-count{flex:none}
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <a href="index.html" class="sq" title="Volver al menú">←</a>
      <h1>Cajas y Espacios</h1>
      <div class="top-right">
        <button class="sq" id="btn-tema" aria-label="Cambiar entre modo claro y oscuro"></button>
        <button class="sq" id="btn-menu" aria-label="Más opciones">⋮</button>
        <div class="menu" id="menu">
          <button id="btn-exportar">💾 Respaldar</button>
          <button id="btn-importar">📂 Cargar</button>
          <hr>
          <div class="menu-sec"><div class="menu-t">Color</div><div class="dots" id="dots"><button data-c="violeta" aria-label="Morado"></button><button data-c="rosa" aria-label="Rosa"></button><button data-c="celeste" aria-label="Celeste"></button><button data-c="agua" aria-label="Aguamarina"></button></div></div>
          <hr>
          <div class="menu-sec"><div class="menu-t">Letra de los títulos</div><div id="fonts"><button data-f="fraunces" style="font-family:'Fraunces',Georgia,serif">Fraunces (la de ahora)</button><button data-f="jakarta" style="font-family:'Plus Jakarta Sans',system-ui,sans-serif">Plus Jakarta (sin serif)</button><button data-f="fira" style="font-family:'Fira Sans',system-ui,sans-serif">Fira Sans</button><button data-f="chivo" style="font-family:'Chivo',system-ui,sans-serif">Chivo</button><button data-f="space" style="font-family:'Space Grotesk',system-ui,sans-serif">Space Grotesk</button></div></div>
        </div>
      </div>
      <input type="file" id="file-input" style="display:none" accept=".json">
    </div>

    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="busqueda" class="search-input" placeholder="Buscar objeto, caja, ubicación o persona..." autocomplete="off">
      <button id="btn-limpiar" class="btn-clear">✕</button>
    </div>

    <div class="aviso" id="aviso-espacio"></div>

    <div id="search-box-results" class="search-results-box">
      <div class="search-title">Resultados</div>
      <div id="search-items" class="items-container"></div>
    </div>

    <div class="tools">
      <span class="tot">Total cajas: <b id="tot-cajas">0</b><span id="tot-objs"></span></span>
      <div class="view" id="view">
        <button data-v="list" aria-label="Vista de lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <button data-v="grid" aria-label="Vista de cuadrícula"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></button>
      </div>
    </div>

    <div id="contenedor-cajas" class="card-list grid"></div>
  </div>

  <button class="fab" id="btn-nueva-caja"><span style="font-size:1.2rem;line-height:1">＋</span> Agregar</button>

  <!-- Detalles de una caja (lista de todo lo que tiene) -->
  <div class="modal-overlay" id="modal-det">
    <div class="modal wide">
      <div class="det-head">
        <div id="det-foto"></div>
        <div class="grow" style="flex:1;min-width:0"><h3 id="det-titulo"></h3><div class="c-sub" id="det-sub"></div></div>
        <button class="sq" data-close aria-label="Cerrar">✕</button>
      </div>
      <div id="det-body"></div>
    </div>
  </div>

  <!-- Modal Caja -->
  <div class="modal-overlay" id="modal-caja">
    <div class="modal">
      <h3 id="caja-titulo">Nueva Caja</h3>
      <div class="form-group">
        <label class="form-label">Nombre del contenedor o lugar</label>
        <input type="text" id="caja-nombre" class="form-input" placeholder="Ej: Caja negra, Cajón de escritorio..." autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label">¿Dónde está? (opcional)</label>
        <input type="text" id="caja-ubi" class="form-input" placeholder="Ej: Closet, repisa 2" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label">Foto de la caja o del lugar (opcional)</label>
        <div class="photo-row">
          <div class="pbox" data-k="cajaFoto"><span class="ph">📦</span><img alt=""><button type="button" class="rm" data-rm="cajaFoto">✕</button></div>
          <button type="button" class="btn btn-secondary" data-pick="cajaFoto">📸 Tomar / Elegir</button>
          <input type="file" class="pfile" data-k="cajaFoto" accept="image/*" hidden>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close>Cancelar</button>
        <button class="btn btn-primary" id="btn-guardar-caja">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal Objeto -->
  <div class="modal-overlay" id="modal-item">
    <div class="modal">
      <h3 id="item-titulo">Agregar Objeto</h3>
      <div class="form-group">
        <label class="form-label">Nombre del objeto</label>
        <input type="text" id="item-nombre" class="form-input" placeholder="Ej: Elásticos, Cargador, Libreta..." autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label">Detalle opcional (color, estado, etc.)</label>
        <input type="text" id="item-detalles" class="form-input" placeholder="Ej: sellado, color negro" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label">Cantidad (opcional: actívala si se gasta)</label>
        <input type="text" id="item-cantidad" class="form-input" inputmode="numeric" placeholder="Ej: 12 (vacío = sin contador)" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label">Prestado a (opcional)</label>
        <input type="text" id="item-prestado" class="form-input" placeholder="Ej: Dani, mi hermana..." autocomplete="off">
      </div>
      <div class="form-group">
        <label class="check"><input type="checkbox" id="item-reponer"> 🛒 Por reponer (lo manda a Compras)</label>
      </div>
      <div class="form-group">
        <label class="form-label">Foto del objeto (opcional)</label>
        <div class="photo-row">
          <div class="pbox" data-k="itemFoto"><span class="ph">📷</span><img alt=""><button type="button" class="rm" data-rm="itemFoto">✕</button></div>
          <button type="button" class="btn btn-secondary" data-pick="itemFoto">📸 Tomar / Elegir</button>
          <input type="file" class="pfile" data-k="itemFoto" accept="image/*" hidden>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close>Cancelar</button>
        <button class="btn btn-primary" id="btn-guardar-item">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal Mover -->
  <div class="modal-overlay" id="modal-mover">
    <div class="modal">
      <h3 id="mover-titulo">Mover objeto</h3>
      <div class="form-group">
        <label class="form-label">Mover a la caja</label>
        <select id="mover-destino" class="form-select"></select>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close>Cancelar</button>
        <button class="btn btn-primary" id="btn-confirmar-mover">Mover</button>
      </div>
    </div>
  </div>

  <!-- Visor de imagen -->
  <div class="modal-overlay" id="modal-viewer">
    <div class="modal" style="text-align:center;max-width:440px">
      <h3 id="viewer-title" style="margin-bottom:10px">Foto</h3>
      <img id="viewer-img" src="" alt="Vista previa grande">
      <div class="modal-footer" style="justify-content:center;margin-top:14px"><button class="btn btn-secondary" data-close>Cerrar</button></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const KEY = 'org_cajas', VKEY = 'vista_cajas', COMPRAS = 'org_compras', CAT_COMPRAS = 'Desde Cajas';
    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
    const vibrar = () => { if (navigator.vibrate) navigator.vibrate(10); };
    const leer = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
    const fechaActual = () => new Date().toLocaleDateString('es-CL', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
    const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    let tt; function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2600); }

    /* ── Datos (normaliza lo antiguo: los respaldos y datos de antes siguen funcionando) ── */
    const cantN = v => { const n = parseInt(String(v ?? '').replace(/\D/g, ''), 10); return Number.isFinite(n) ? Math.min(n, 99999) : null; };
    function normItem(x) {
      return {
        id: String(x.id || uid('it_')), nombre: String(x.nombre || '').trim(), detalles: String(x.detalles || '').trim(),
        fecha: String(x.fecha || fechaActual()), foto: typeof x.foto === 'string' && x.foto ? x.foto : null,
        cantidad: x.cantidad === null || x.cantidad === undefined || x.cantidad === '' ? null : cantN(x.cantidad),
        prestadoA: String(x.prestadoA || '').trim(), porReponer: !!x.porReponer
      };
    }
    function normCaja(c) {
      return {
        id: String(c.id || uid('c_')), nombre: String(c.nombre || 'Caja').trim() || 'Caja',
        ubicacion: String(c.ubicacion || '').trim(), foto: typeof c.foto === 'string' && c.foto ? c.foto : null,
        items: (Array.isArray(c.items) ? c.items : []).filter(x => x && typeof x === 'object' && String(x.nombre || '').trim()).map(normItem)
      };
    }
    let db = (Array.isArray(leer(KEY, [])) ? leer(KEY, []) : []).filter(c => c && typeof c === 'object').map(normCaja);
    let cajaId = null, itemId = null, detId = null;
    let vista = 'grid'; try { vista = localStorage.getItem(VKEY) === 'list' ? 'list' : 'grid'; } catch (e) {}
    const fotos = { cajaFoto: null, itemFoto: null };

    function guardar() {
      try { localStorage.setItem(KEY, JSON.stringify(db)); }
      catch (e) { alert('No hay más espacio en el navegador. Haz un respaldo y quita algunas fotos.'); }
      render();
    }

    /* ── Compras (misma carpeta de GitHub Pages: comparten el navegador) ── */
    function leerCompras() { const d = leer(COMPRAS, []); return Array.isArray(d) ? d : []; }
    function guardarCompras(d) { try { localStorage.setItem(COMPRAS, JSON.stringify(d)); return true; } catch (e) { return false; } }
    function setReponer(c, it, on) {
      const compras = leerCompras();
      const hay = () => { for (const k of compras) for (const p of (k.items || [])) if (p && p.deCaja === it.id) return [k, p]; return null; };
      const ya = hay();
      if (on) {
        it.porReponer = true;
        if (ya && ya[1].tieneRepuesto === 'no') return;
        if (ya) { Object.assign(ya[1], { tieneRepuesto:'no', lugarRepuesto:'', cantidadRepuesto:'' }); }
        else {
          let k = compras.find(x => x.nombre === CAT_COMPRAS);
          if (!k) { k = { id: uid('cat_'), nombre: CAT_COMPRAS, items: [] }; compras.unshift(k); }
          k.items = k.items || [];
          k.items.unshift({ id: uid('p_'), nombre: it.nombre, tieneRepuesto:'no', lugarRepuesto:'', cantidadRepuesto:'', queda: it.cantidad !== null ? String(it.cantidad) : '', cuando:'', urgente:false, donde:'', precio:'', instrucciones:`Viene de la caja "${c.nombre}"${c.ubicacion ? ' (' + c.ubicacion + ')' : ''}`, enlace:'', foto: it.foto || null, fotoTienda:null, deCaja: it.id });
        }
        if (!guardarCompras(compras)) { it.porReponer = false; alert('No pude enviarlo a Compras: no hay espacio en el navegador.'); }
      } else {
        it.porReponer = false;
        if (ya && ya[1].tieneRepuesto === 'no') { ya[0].items = ya[0].items.filter(p => p !== ya[1]); guardarCompras(compras); }
      }
    }
    /* Si en Compras ya lo compraste (o lo borraste), se quita la marca aquí */
    function sincronizar() {
      const compras = leerCompras(); let cambio = false;
      db.forEach(c => c.items.forEach(it => {
        if (!it.porReponer) return;
        let p = null; compras.forEach(k => (k.items || []).forEach(x => { if (x && x.deCaja === it.id) p = x; }));
        if (!p || p.tieneRepuesto === 'si') { it.porReponer = false; cambio = true; }
      }));
      return cambio;
    }

    /* ── Fotos ── */
    function comprimir(file, max, cb) {
      const r = new FileReader();
      r.onload = e => {
        const img = new Image();
        img.onload = () => {
          const k = Math.min(1, max / Math.max(img.width, img.height));
          const w = Math.round(img.width * k), h = Math.round(img.height * k);
          const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          cv.getContext('2d').drawImage(img, 0, 0, w, h);
          cb(cv.toDataURL('image/jpeg', .65));
        };
        img.src = e.target.result;
      };
      r.readAsDataURL(file);
    }
    function setPrev(k) {
      const b = $(`.pbox[data-k="${k}"]`), src = fotos[k], im = b.querySelector('img');
      im.src = src || ''; im.style.display = src ? 'block' : 'none';
      b.querySelector('.ph').style.display = src ? 'none' : 'block';
      b.querySelector('.rm').style.display = src ? 'flex' : 'none';
    }
    document.addEventListener('click', e => {
      const p = e.target.closest('[data-pick]'); if (p) $(`.pfile[data-k="${p.dataset.pick}"]`).click();
      const r = e.target.closest('[data-rm]'); if (r) { fotos[r.dataset.rm] = null; $(`.pfile[data-k="${r.dataset.rm}"]`).value = ''; setPrev(r.dataset.rm); }
    });
    $$('.pfile').forEach(inp => inp.onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      comprimir(f, 500, d => { fotos[inp.dataset.k] = d; setPrev(inp.dataset.k); });
    });
    function verFoto(src, titulo) { $('#viewer-img').src = src; $('#viewer-title').textContent = titulo || 'Foto'; abrir('#modal-viewer'); }

    /* ── Render ── */
    function itemHTML(c, it, showCaja) {
      const d = `data-c="${esc(c.id)}" data-i="${esc(it.id)}"`;
      const sinStock = it.cantidad === 0;
      return `<div class="item-row"><div class="item-top">
        ${it.foto ? `<img src="${it.foto}" class="item-thumb" data-act="foto" ${d} alt="Foto de ${esc(it.nombre)}">` : ''}
        <div class="grow">
          <div class="item-name">${esc(it.nombre)}${showCaja ? ` <span class="badge cat">${esc(c.nombre)}${c.ubicacion ? ' · ' + esc(c.ubicacion) : ''}</span>` : ''}</div>
          <div class="item-meta">
            <div class="badges">
              ${it.detalles ? `<span class="badge ok">${esc(it.detalles)}</span>` : ''}
              ${it.prestadoA ? `<span class="badge warn">🤝 Prestado a ${esc(it.prestadoA)}</span>` : ''}
              ${sinStock ? '<span class="badge bad">Agotado</span>' : ''}
            </div>
            <div>Editado: ${esc(it.fecha)}</div>
          </div>
        </div>
        <div class="nowrap"><button class="btn-icon" data-act="edit" ${d} aria-label="Editar">✎</button><button class="btn-icon" data-act="del" ${d} aria-label="Eliminar">🗑</button></div></div>
        <div class="item-actions">
          ${it.cantidad !== null ? `<div class="stepper"><button data-act="menos" ${d} aria-label="Restar uno">−</button><b>${it.cantidad}</b><button data-act="mas" ${d} aria-label="Sumar uno">+</button></div>` : ''}
          <button class="mini${it.porReponer ? ' on' : ''}" data-act="reponer" ${d}>🛒 ${it.porReponer ? 'En Compras' : 'Por reponer'}</button>
          <button class="mini" data-act="mover" ${d}>⇄ Mover</button>
        </div></div>`;
    }

    function tarjeta(c) {
      const d = `data-c="${esc(c.id)}"`, n = c.items.length;
      return `<div class="group-card">
        <div class="c-head">
          <div style="display:flex;gap:8px;align-items:flex-start;min-width:0">${c.foto ? `<img src="${c.foto}" class="caja-thumb" data-act="fotocaja" ${d} alt="Foto de ${esc(c.nombre)}">` : ''}<div class="c-name">${esc(c.nombre)}</div></div>
          <div class="c-ic"><button class="btn-icon" data-act="editcaja" ${d} aria-label="Editar caja">✎</button><button class="btn-icon" data-act="delcaja" ${d} aria-label="Eliminar caja">🗑</button></div>
        </div>
        <div class="c-sub">${n} objeto${n === 1 ? '' : 's'}</div>
        ${c.ubicacion ? `<div class="c-sub">📍 ${esc(c.ubicacion)}</div>` : ''}
        <div class="c-acts"><button class="btn btn-det" data-act="detalles" ${d}>Detalles</button><button class="btn btn-add" data-act="newitem" ${d}>+ Agregar</button></div>
      </div>`;
    }

    function render() {
      const cont = $('#contenedor-cajas');
      cont.className = 'card-list ' + vista;
      $$('#view button').forEach(b => b.classList.toggle('on', b.dataset.v === vista));
      const nIt = db.reduce((s, c) => s + c.items.length, 0);
      $('#tot-cajas').textContent = db.length;
      $('#tot-objs').textContent = db.length ? ` · ${nIt} objeto${nIt === 1 ? '' : 's'}` : '';
      cont.innerHTML = db.length ? db.map(tarjeta).join('') : `<div class="vacio">No tienes cajas creadas.<br>Toca <b>＋ Agregar</b> para comenzar.</div>`;
      buscar(); espacio(); if (detId) renderDet();
    }

    /* Detalles: lista de todo lo que hay en la caja */
    function abrirDet(id) { detId = id; renderDet(); abrir('#modal-det'); }
    function renderDet() {
      const c = db.find(x => x.id === detId);
      if (!c) { detId = null; $('#modal-det').classList.remove('active'); return; }
      const d = `data-c="${esc(c.id)}"`, n = c.items.length;
      $('#det-titulo').textContent = c.nombre;
      $('#det-sub').textContent = `${n} objeto${n === 1 ? '' : 's'}${c.ubicacion ? ' · 📍 ' + c.ubicacion : ''}`;
      $('#det-foto').innerHTML = c.foto ? `<img src="${c.foto}" class="caja-thumb" data-act="fotocaja" ${d} alt="Foto de ${esc(c.nombre)}">` : '';
      $('#det-body').innerHTML = `<button class="btn btn-add-item" style="margin-top:0" data-act="newitem" ${d}>+ Agregar objeto</button>
        <div class="items-container">${n ? c.items.map(it => itemHTML(c, it, false)).join('') : '<div style="font-size:.85rem;color:var(--muted);font-style:italic;padding:4px 0">Esta caja está vacía.</div>'}</div>`;
    }

    function buscar() {
      const q = $('#busqueda').value, ws = norm(q).split(/\s+/).filter(Boolean);
      $('#btn-limpiar').style.display = q ? 'block' : 'none';
      const box = $('#search-box-results');
      if (!ws.length) { box.style.display = 'none'; return; }
      let h = '';
      db.forEach(c => c.items.forEach(it => {
        const hay = norm([it.nombre, it.detalles, it.prestadoA, c.nombre, c.ubicacion].join(' '));
        if (ws.every(w => hay.includes(w))) h += itemHTML(c, it, true);
      }));
      $('#search-items').innerHTML = h || '<div style="font-size:.85rem;color:var(--muted);padding:6px 0">Sin coincidencias.</div>';
      box.style.display = 'block';
    }

    /* Aviso de espacio (el navegador guarda unos 5 MB en total) */
    function espacio() {
      let n = 0; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); n += k.length + (localStorage.getItem(k) || '').length; } } catch (e) {}
      const pct = Math.round(n / 5000000 * 100), el = $('#aviso-espacio');
      el.style.display = pct >= 75 ? 'block' : 'none';
      if (pct >= 75) el.textContent = `⚠️ El espacio del navegador va en un ${Math.min(pct, 100)}% (comparte lugar con tus otras páginas). Haz un respaldo y quita algunas fotos pronto.`;
    }

    /* ── Acciones (todo por data-atributos: los nombres con ' " < > no rompen nada) ── */
    function acciones(e) {
      const b = e.target.closest('[data-act]'); if (!b) return;
      const a = b.dataset.act, c = db.find(x => x.id === b.dataset.c), it = c && c.items.find(x => x.id === b.dataset.i);
      if (!c) return;
      if (a === 'detalles') { vibrar(); return abrirDet(c.id); }
      if (a === 'fotocaja') return verFoto(c.foto, c.nombre);
      if (a === 'editcaja') { vibrar(); return abrirCaja(c.id); }
      if (a === 'delcaja') { vibrar(); if (confirm(`¿Eliminar la caja "${c.nombre}" y su contenido?`)) { db = db.filter(x => x.id !== c.id); guardar(); } return; }
      if (a === 'newitem') { vibrar(); return abrirItem(c.id); }
      if (!it) return;
      vibrar();
      if (a === 'foto') return verFoto(it.foto, it.nombre);
      if (a === 'edit') return abrirItem(c.id, it.id);
      if (a === 'del') { if (confirm(`¿Eliminar "${it.nombre}"?`)) { if (it.porReponer) setReponer(c, it, false); c.items = c.items.filter(x => x.id !== it.id); guardar(); } return; }
      if (a === 'mas') { it.cantidad = Math.min(99999, (it.cantidad || 0) + 1); return guardar(); }
      if (a === 'menos') {
        it.cantidad = Math.max(0, (it.cantidad || 0) - 1); guardar();
        if (it.cantidad === 0 && !it.porReponer && confirm(`Se acabó "${it.nombre}". ¿Mandarlo a Compras?`)) { setReponer(c, it, true); guardar(); toast('Enviado a Compras'); }
        return;
      }
      if (a === 'reponer') { const on = !it.porReponer; setReponer(c, it, on); guardar(); if (on && it.porReponer) toast('Enviado a Compras'); else if (!on) toast('Quitado de Compras'); return; }
      if (a === 'mover') return abrirMover(c.id, it.id);
    }
    $('#contenedor-cajas').addEventListener('click', acciones);
    $('#search-items').addEventListener('click', acciones);
    $('#det-body').addEventListener('click', acciones);
    $('#det-foto').addEventListener('click', acciones);
    $('#busqueda').addEventListener('input', buscar);
    $('#btn-limpiar').onclick = () => { $('#busqueda').value = ''; buscar(); };
    $('#view').onclick = e => { const b = e.target.closest('button'); if (!b) return; vista = b.dataset.v; try { localStorage.setItem(VKEY, vista); } catch (er) {} render(); };

    /* ── Cajas ── */
    function abrirCaja(id) {
      cajaId = id || null;
      const c = id ? db.find(x => x.id === id) : null;
      $('#caja-titulo').textContent = c ? 'Editar caja' : 'Nueva Caja';
      $('#caja-nombre').value = c ? c.nombre : ''; $('#caja-ubi').value = c ? c.ubicacion : '';
      fotos.cajaFoto = c ? c.foto : null; $$('.pfile').forEach(i => i.value = ''); setPrev('cajaFoto');
      abrir('#modal-caja'); setTimeout(() => $('#caja-nombre').focus(), 150);
    }
    $('#btn-nueva-caja').onclick = () => { vibrar(); abrirCaja(); };
    $('#btn-guardar-caja').onclick = () => {
      const nombre = $('#caja-nombre').value.trim(); if (!nombre) return; vibrar();
      const ubicacion = $('#caja-ubi').value.trim();
      if (cajaId) Object.assign(db.find(x => x.id === cajaId), { nombre, ubicacion, foto: fotos.cajaFoto });
      else db.unshift({ id: uid('c_'), nombre, ubicacion, foto: fotos.cajaFoto, items: [] });
      cerrar(); guardar();
    };

    /* ── Objetos ── */
    function abrirItem(cid, iid) {
      cajaId = cid; itemId = iid || null;
      const it = iid ? db.find(x => x.id === cid).items.find(x => x.id === iid) : null;
      $('#item-titulo').textContent = it ? 'Editar objeto' : 'Agregar objeto';
      $('#item-nombre').value = it ? it.nombre : ''; $('#item-detalles').value = it ? it.detalles : '';
      $('#item-cantidad').value = it && it.cantidad !== null ? it.cantidad : '';
      $('#item-prestado').value = it ? it.prestadoA : ''; $('#item-reponer').checked = !!it && it.porReponer;
      fotos.itemFoto = it ? it.foto : null; $$('.pfile').forEach(i => i.value = ''); setPrev('itemFoto');
      abrir('#modal-item'); setTimeout(() => $('#item-nombre').focus(), 150);
    }
    $('#btn-guardar-item').onclick = () => {
      const nombre = $('#item-nombre').value.trim(); if (!nombre) return; vibrar();
      const c = db.find(x => x.id === cajaId); if (!c) return;
      const datos = { nombre, detalles: $('#item-detalles').value.trim(), cantidad: cantN($('#item-cantidad').value), prestadoA: $('#item-prestado').value.trim(), foto: fotos.itemFoto, fecha: fechaActual() };
      let it;
      if (itemId) { it = c.items.find(x => x.id === itemId); Object.assign(it, datos); }
      else { it = normItem({ id: uid('it_'), ...datos }); c.items.unshift(it); }
      const quiere = $('#item-reponer').checked;
      if (quiere !== it.porReponer) setReponer(c, it, quiere);
      cerrar(); guardar();
      if (quiere && it.porReponer) toast('Enviado a Compras');
    };

    /* ── Mover objeto a otra caja ── */
    function abrirMover(cid, iid) {
      cajaId = cid; itemId = iid;
      const c = db.find(x => x.id === cid), it = c.items.find(x => x.id === iid);
      const otras = db.filter(x => x.id !== cid);
      if (!otras.length) return alert('Crea otra caja primero para poder mover objetos.');
      $('#mover-titulo').textContent = `Mover "${it.nombre}"`;
      $('#mover-destino').innerHTML = otras.map(x => `<option value="${esc(x.id)}">${esc(x.nombre)}${x.ubicacion ? ' — ' + esc(x.ubicacion) : ''}</option>`).join('');
      abrir('#modal-mover');
    }
    $('#btn-confirmar-mover').onclick = () => {
      const c = db.find(x => x.id === cajaId), dest = db.find(x => x.id === $('#mover-destino').value);
      const it = c && c.items.find(x => x.id === itemId); if (!it || !dest) return; vibrar();
      c.items = c.items.filter(x => x.id !== itemId); it.fecha = fechaActual(); dest.items.unshift(it);
      cerrar(); guardar(); toast(`Movido a ${dest.nombre}`);
    };

    /* ── Modales (el de Detalles queda abierto cuando se cierra uno que se abrió encima) ── */
    const abrir = s => $(s).classList.add('active');
    function cerrarUno(ov) {
      ov.classList.remove('active');
      if (ov.id === 'modal-det') detId = null;
      else if (ov.id !== 'modal-viewer') { cajaId = null; itemId = null; }
    }
    function cerrar() { $$('.modal-overlay').forEach(m => { if (m.id !== 'modal-det' && m.classList.contains('active')) cerrarUno(m); }); }
    document.addEventListener('click', e => {
      const ov = e.target.classList.contains('modal-overlay') ? e.target : (e.target.closest('[data-close]') && e.target.closest('.modal-overlay'));
      if (ov) cerrarUno(ov);
    });
    window.addEventListener('keydown', e => { if (e.key === 'Escape') { const a = $$('.modal-overlay.active'); if (a.length) cerrarUno(a[a.length - 1]); } });

    /* ── Menú ⋮ ── */
    $('#btn-menu').onclick = e => { e.stopPropagation(); $('#menu').classList.toggle('open'); };
    document.addEventListener('click', () => $('#menu').classList.remove('open'));

    /* ── Respaldo (valida y pregunta antes de reemplazar) ── */
    $('#btn-exportar').onclick = () => {
      vibrar();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type:'application/json' }));
      a.download = `respaldo-cajas-${new Date().toISOString().slice(0, 10)}.json`; a.click();
    };
    $('#btn-importar').onclick = () => { vibrar(); $('#file-input').click(); };
    $('#file-input').onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      const r = new FileReader();
      r.onload = ev => {
        try {
          const d = JSON.parse(ev.target.result);
          if (!Array.isArray(d) || !d.length || d.some(c => !c || typeof c !== 'object' || typeof c.nombre !== 'string')) throw 0;
          const nuevo = d.map(normCaja), n = nuevo.reduce((s, c) => s + c.items.length, 0);
          if (!confirm(`El archivo trae ${nuevo.length} caja${nuevo.length === 1 ? '' : 's'} con ${n} objeto${n === 1 ? '' : 's'}.\nEsto reemplaza las que tienes ahora (${db.length}). ¿Continuar?`)) return;
          db = nuevo; guardar(); toast('¡Cajas cargadas con éxito!');
        } catch (err) { alert('Archivo no válido: no parece un respaldo de Cajas.'); }
        e.target.value = '';
      };
      r.readAsText(file);
    };

    /* ── Tema claro / oscuro (clave compartida app_tema) ── */
    const mq = matchMedia('(prefers-color-scheme: dark)');
    const temaPref = () => { try { return localStorage.getItem('app_tema') || 'auto'; } catch (e) { return 'auto'; } };
    const oscuro = () => temaPref() === 'oscuro' || (temaPref() === 'auto' && mq.matches);
    function aplicarTema() {
      document.documentElement.dataset.theme = oscuro() ? 'dark' : 'light';
      $('#btn-tema').textContent = oscuro() ? '☀️' : '🌙';
      const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    }
    $('#btn-tema').onclick = () => { vibrar(); try { localStorage.setItem('app_tema', oscuro() ? 'claro' : 'oscuro'); } catch (e) {} aplicarTema(); };
    if (mq.addEventListener) mq.addEventListener('change', aplicarTema);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { aplicarTema(); if (sincronizar()) guardar(); else render(); } });

    aplicarTema();
    if (sincronizar()) { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
    render();
  </script>
  <script>
    /* ── Letra de los títulos y color (se guardan en el navegador) ── */
    const FUENTES = {fraunces:"'Fraunces',Georgia,serif",jakarta:"'Plus Jakarta Sans',system-ui,sans-serif",fira:"'Fira Sans',system-ui,sans-serif",chivo:"'Chivo',system-ui,sans-serif",space:"'Space Grotesk',system-ui,sans-serif"};
    function aplicarFuente() {
      let f = 'fraunces'; try { f = localStorage.getItem('app_fuente') || 'fraunces'; } catch (e) {}
      if (!FUENTES[f]) f = 'fraunces';
      document.documentElement.style.setProperty('--serif', FUENTES[f]);
      $$('#fonts button').forEach(b => b.classList.toggle('on', b.dataset.f === f));
    }
    $('#fonts').onclick = e => { const b = e.target.closest('button'); if (!b) return; try { localStorage.setItem('app_fuente', b.dataset.f); } catch (er) {} aplicarFuente(); };
    aplicarFuente();
    $('#menu').addEventListener('click', e => { if (e.target.closest('.menu-sec')) e.stopPropagation(); });
    const ACC_KEY = 'color_cajas', ACC_DEF = 'violeta';
    function aplicarAcc() {
      let a = ACC_DEF; try { a = localStorage.getItem(ACC_KEY) || ACC_DEF; } catch (e) {}
      if (!['violeta', 'rosa', 'celeste', 'agua'].includes(a)) a = ACC_DEF;
      document.documentElement.dataset.acc = a;
      $$('#dots button').forEach(b => b.classList.toggle('on', b.dataset.c === a));
    }
    $('#dots').onclick = e => { const b = e.target.closest('button'); if (!b) return; try { localStorage.setItem(ACC_KEY, b.dataset.c); } catch (er) {} aplicarAcc(); };
    aplicarAcc();
  </script>
  <script>
    /* Títulos largos: bajan de tamaño hasta caber en 2 líneas; si aun así no caben, se cortan con … */
    (function () {
      const SEL = '.group-title, .c-name, #det-titulo';
      let raf = 0;
      function ajustar() {
        raf = 0;
        document.querySelectorAll(SEL).forEach(el => {
          el.style.fontSize = ''; el.style.overflowWrap = 'normal';   /* se mide sin partir palabras */
          const base = parseFloat(getComputedStyle(el).fontSize), min = Math.max(11, base * .62);
          let fs = base;
          const mal = () => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1;
          while (mal() && fs > min) { fs -= .5; el.style.fontSize = fs + 'px'; }
          el.style.overflowWrap = '';   /* si una palabra no cabe ni en el mínimo, ahí sí se corta */
        });
      }
      const pedir = () => { if (!raf) raf = requestAnimationFrame(ajustar); };
      new MutationObserver(pedir).observe(document.body, { childList: true, subtree: true, characterData: true });
      new MutationObserver(pedir).observe(document.documentElement, { attributes: true, attributeFilter: ['style', 'data-theme'] });
      addEventListener('resize', pedir);
      if (document.fonts) { if (document.fonts.ready) document.fonts.ready.then(pedir); if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', pedir); }
      pedir();
    })();
  </script>
